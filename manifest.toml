#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "penpot"
name = "Penpot"
description.en = "Design and prototyping platform"
description.fr = "Plateforme de conception et de prototypage"

version = "2.17.0~ynh2"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://penpot.app/"
admindoc = "https://help.penpot.app/technical-guide/"
userdoc = "https://help.penpot.app/user-guide/"
code = "https://github.com/penpot/penpot"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = true

sso = false

disk = "500M"
ram.build = "500M"
ram.runtime = "500M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/orhtej2/penpot-binary/releases/download/2.17.0-extracted/penpot-frontend-extracted.tar.gz"
    sha256 = "14b5430b3a28ee71b5698afb8a845d4fdfaf1ce09f8e970a3cdfd6ba995ec596"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset = "penpot-frontend-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.sources.backend]
    url = "https://github.com/orhtej2/penpot-binary/releases/download/2.17.0-extracted/penpot-backend-extracted.tar.gz"
    sha256 = "cc00b8fefdf5e3ee3caa1b5cca2accca300ace9abad79a16567b291d4389edc6"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset = "penpot-backend-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.sources.exporter]
    amd64.url = "https://github.com/orhtej2/penpot-binary/releases/download/2.17.0-extracted/penpot-exporter-amd64-extracted.tar.gz"
    amd64.sha256 = "a17e5d03e3c8a9a3404b999a8eee9c6988f936eef8caa81d72dd80fe1d364393"
    arm64.url = "https://github.com/orhtej2/penpot-binary/releases/download/2.17.0-extracted/penpot-exporter-arm64-extracted.tar.gz"
    arm64.sha256 = "4187ff3211bb8043bb638fcd6252db1fb2d9af8a67f13ada3a34bc3b0c9a7437"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset.amd64 = "penpot-exporter-amd64-extracted\\.tar\\.gz$"
    autoupdate.asset.arm64 = "penpot-exporter-arm64-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"
    prefetch = false

    [resources.sources.jre]
    amd64.url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_x64_linux_hotspot_25.0.3_9.tar.gz"
    amd64.sha256 = "487ad434d8b121ae3902d5ad9cb830cd8e1f75fefad6e2ba80f89d60e3db95d7"
    arm64.url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_aarch64_linux_hotspot_25.0.3_9.tar.gz"
    arm64.sha256 = "d12d5b19ff7f6c4a99fd4f9eecede2c96e64df7d1f41cc84f2e9c9b38408600b"
    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "jdk-(\\d+\\.\\d+\\.\\d+)\\+(.*)"
    autoupdate.upstream = "https://github.com/adoptium/temurin25-binaries"
    autoupdate.asset.amd64 = "OpenJDK.*-jre_x64_linux_hotspot_.*\\.tar\\.gz$"
    autoupdate.asset.arm64 = "OpenJDK.*-jre_aarch64_linux_hotspot_.*\\.tar\\.gz$"
    prefetch = false

    [resources.sources.imagemagick]
    amd64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-28/imagemagick-7.1.2-28-linux-amd64.tar.gz"
    amd64.sha256 = "cfce78824f887b23537d714e714ee1463cdf1e23352578245a9ff7877fdc2276"
    arm64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-28/imagemagick-7.1.2-28-linux-arm64.tar.gz"
    arm64.sha256 = "c40ba6f436573eaea9cc76384a90ce066ef6f47260be221389845927fd7d86f5"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/imagemagick-binary"
    autoupdate.asset.amd64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-amd64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-arm64\\.tar\\.gz$"
    prefetch = false

    [resources.sources.imagemagick-policy]
    url = "https://raw.githubusercontent.com/penpot/penpot/034bab99c9abcbf5aadf7418ef40747925398ae3/docker/images/files/imagemagick-policy.xml"
    sha256 = "f5d9a98218665d8afe11a6ed772be901e1c84ddcbba7c3a9c9e1d6a32b004012"
    format = "whatever"
    extract = false
    rename = "policy.xml"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["assets"]
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
        [resources.ports.exporter]

    [resources.apt]
    packages = [
        "postgresql",
        "redis",
        "tzdata",
        "locales",
        "ca-certificates",
        "fontconfig",
        "xz-utils",
        "imagemagick",
        "ghostscript",
        "netpbm",
        "poppler-utils",
        "potrace",
        "libasound2",
        "libatk1.0-0",
        "libatk-bridge2.0-0",
        "libatomic1",
        "libcairo2",
        "libcups2",
        "libdbus-1-3",
        "libexpat1",
        "libfontconfig1",
        "libgcc1",
        "libglib2.0-0",
        "libgtk-3-0",
        "libnspr4",
        "libpango-1.0-0",
        "libpangocairo-1.0-0",
        "libx11-6",
        "libx11-xcb1",
        "libxcb1",
        "libxcb-dri3-0",
        "libxcomposite1",
        "libxcursor1",
        "libxdamage1",
        "libxext6",
        "libxfixes3",
        "libxi6",
        "libxrandr2",
        "libxrender1",
        "libxshmfence1",
        "libxss1",
        "libxtst6",
        "fonts-liberation",
        "libnss3",
        "libgbm1",
        "webp",
        "rlwrap",
        "woff-tools",
        "woff2",
        "python3",
        "python3-tabulate",
        "fontforge",
        "rsync"
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "22"
