#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "penpot"
name = "Penpot"
description.en = "Design and prototyping platform"
description.fr = "Plateforme de conception et de prototypage"

version = "2.19.4~ynh1"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://penpot.app/"
admindoc = "https://help.penpot.app/technical-guide/"
userdoc = "https://help.penpot.app/user-guide/"
code = "https://github.com/penpot/penpot"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = true
sso = false

disk = "500M"
ram.build = "500M"
ram.runtime = "500M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/orhtej2/penpot-binary/releases/download/2.19.4-extracted/penpot-frontend-extracted.tar.gz"
    sha256 = "3f9a7e5b7b64c0d677d52126d1ea497da07870712c47a24cbe820c9f42e69f50"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset = "penpot-frontend-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.sources.backend]
    url = "https://github.com/orhtej2/penpot-binary/releases/download/2.19.4-extracted/penpot-backend-extracted.tar.gz"
    sha256 = "232ed8536c1c5b54a4ef9549476d28ff9b155f2cc19daf6456224fd7bfddbdba"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset = "penpot-backend-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.sources.exporter]
    amd64.url = "https://github.com/orhtej2/penpot-binary/releases/download/2.19.4-extracted/penpot-exporter-amd64-extracted.tar.gz"
    amd64.sha256 = "552c818ac86782af3f501f3f8968d868a26148c196dc6402065b42e2387e9376"
    arm64.url = "https://github.com/orhtej2/penpot-binary/releases/download/2.19.4-extracted/penpot-exporter-arm64-extracted.tar.gz"
    arm64.sha256 = "c373d5f03ac9d30f4c415632bec08f069c6b349e6670aadc447af6f1bf0658d4"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/penpot-binary"
    autoupdate.asset.amd64 = "penpot-exporter-amd64-extracted\\.tar\\.gz$"
    autoupdate.asset.arm64 = "penpot-exporter-arm64-extracted\\.tar\\.gz$"
    autoupdate.version_regex = "(\\d+\\.\\d+\\.\\d+)-extracted"

    [resources.sources.jre]
    amd64.url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jre_x64_linux_hotspot_25.0.5.1_2.tar.gz"
    amd64.sha256 = "2edef9e4f81ec5ee426d023336d4cfbd7b4644e99884e7a73a6a867b70b17acf"
    arm64.url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jre_aarch64_linux_hotspot_25.0.5.1_2.tar.gz"
    arm64.sha256 = "c6161dcfb365024fbfbcda265343d562d6f821c78dd8e7aeaeaf294893f6ff8b"
    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "jdk-(?P<main>\\d+(\\.\\d+)+)\\+(?P<plus>.*)"
    autoupdate.upstream = "https://github.com/adoptium/temurin25-binaries"
    autoupdate.asset.amd64 = "OpenJDK.*-jre_x64_linux_hotspot_.*\\.tar\\.gz$"
    autoupdate.asset.arm64 = "OpenJDK.*-jre_aarch64_linux_hotspot_.*\\.tar\\.gz$"

    [resources.sources.imagemagick]
    amd64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-36/imagemagick-7.1.2-36-linux-amd64.tar.gz"
    amd64.sha256 = "9d4bdf0ad6dea53bba3419bb1947f245eb150211b7cae65449546a0d2325423d"
    arm64.url = "https://github.com/orhtej2/imagemagick-binary/releases/download/7.1.2-36/imagemagick-7.1.2-36-linux-arm64.tar.gz"
    arm64.sha256 = "270d09dd4f2fb4eb7bcd9b371b4f9c604dfb2e1f339c68e233d9b6591e609e0b"
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/orhtej2/imagemagick-binary"
    autoupdate.asset.amd64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-amd64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "imagemagick-\\d+\\.\\d+\\.\\d+-\\d+-linux-arm64\\.tar\\.gz$"

    [resources.sources.imagemagick-policy]
    url = "https://raw.githubusercontent.com/penpot/penpot/034bab99c9abcbf5aadf7418ef40747925398ae3/docker/images/files/imagemagick-policy.xml"
    sha256 = "f5d9a98218665d8afe11a6ed772be901e1c84ddcbba7c3a9c9e1d6a32b004012"
    format = "whatever"
    extract = false
    rename = "policy.xml"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["assets"]
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
        [resources.ports.exporter]

    [resources.apt]
    packages = [
        "postgresql",
        "redis",
        "tzdata",
        "locales",
        "ca-certificates",
        "fontconfig",
        "xz-utils",
        "imagemagick",
        "ghostscript",
        "netpbm",
        "poppler-utils",
        "potrace",
        "libasound2",
        "libatk1.0-0",
        "libatk-bridge2.0-0",
        "libatomic1",
        "libcairo2",
        "libcups2",
        "libdbus-1-3",
        "libexpat1",
        "libfontconfig1",
        "libgcc1",
        "libglib2.0-0",
        "libgtk-3-0",
        "libnspr4",
        "libpango-1.0-0",
        "libpangocairo-1.0-0",
        "libx11-6",
        "libx11-xcb1",
        "libxcb1",
        "libxcb-dri3-0",
        "libxcomposite1",
        "libxcursor1",
        "libxdamage1",
        "libxext6",
        "libxfixes3",
        "libxi6",
        "libxrandr2",
        "libxrender1",
        "libxshmfence1",
        "libxss1",
        "libxtst6",
        "fonts-liberation",
        "libnss3",
        "libgbm1",
        "webp",
        "rlwrap",
        "woff-tools",
        "woff2",
        "python3",
        "python3-tabulate",
        "fontforge",
        "rsync"
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
